name: CI

# Runs on every push to main and on every PR targeting main, so branch
# protection can require these two jobs to pass before a merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Runners are pinned instead of ubuntu-latest so a GitHub image change (latest moves
# to Ubuntu 26 from 2026-10-19) cannot break CI unexpectedly. Upgrade deliberately.
jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          # Caches ~/.m2 keyed by pom.xml, so dependency downloads aren't
          # repeated on every run.
          cache: maven

      # GitHub-hosted runners already have Docker available, which is all
      # Testcontainers needs to start its own throwaway Postgres per test —
      # no docker-compose.yml involved here, that's local-dev-only.
      - run: ./mvnw verify

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci (not install): installs exactly what package-lock.json
      # records, and fails instead of silently updating it.
      - run: npm ci
      - run: npx ng lint
      # Vitest + jsdom: no browser needed, so it runs fine on a bare runner.
      - run: npx ng test --watch=false
      # The /api forwarding function is plain JS outside the Angular build, so it
      # has its own test step (Node's built-in runner, no extra dependency).
      - run: npm run test:functions
      - run: npx ng build --configuration production
